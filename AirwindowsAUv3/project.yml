name: AirwindowsAUv3
options:
  bundleIdPrefix: com.terrordisco.airwindows
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CV7UBF55FQ
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "2"

packages:
  AirwindowsUI:
    path: Packages/AirwindowsUI

schemes:
  AirwindowsApp:
    build:
      targets:
        AirwindowsApp: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  AirwindowsApp:
    type: application
    platform: iOS
    sources:
      - path: AirwindowsApp
        excludes:
          - "*.entitlements"
      - path: AirwindowsAUExtension
        excludes:
          - Info.plist
          - "*.entitlements"
          - BridgingHeader.h
          - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terrordisco.airwindows.consolidated
        INFOPLIST_FILE: AirwindowsApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: AirwindowsApp/BridgingHeader.h
        CODE_SIGN_ENTITLEMENTS: AirwindowsApp/AirwindowsApp.entitlements
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MACCATALYST: false
    dependencies:
      - target: AirwindowsDSP
        embed: true
      - target: AirwindowsAUExtension
        embed: true
      - package: AirwindowsUI
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudioKit.framework

  AirwindowsAUExtension:
    type: app-extension
    platform: iOS
    productType: com.apple.product-type.extensionKit-extension
    sources:
      - path: AirwindowsAUExtension
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terrordisco.airwindows.consolidated.auv3
        INFOPLIST_FILE: AirwindowsAUExtension/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: AirwindowsAUExtension/BridgingHeader.h
        CODE_SIGN_ENTITLEMENTS: AirwindowsAUExtension/AirwindowsAUExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MACCATALYST: false
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - target: AirwindowsDSP
        embed: false
        link: true
      - package: AirwindowsUI
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudioKit.framework

  AirwindowsDSP:
    type: framework
    platform: iOS
    sources:
      - path: AirwindowsDSP/AirwindowsDSP.h
      - path: AirwindowsDSP/Bridge
      - path: AirwindowsDSP/Airwin/airwin_consolidated_base.h
      - path: AirwindowsDSP/Airwin/airwin_consolidated_base.cpp
      - path: AirwindowsDSP/Airwin/AirwinRegistry.h
      - path: AirwindowsDSP/Airwin/AirwinRegistry.cpp
      - path: AirwindowsDSP/Airwin/ModuleAdd.h
      - path: AirwindowsDSP/Airwin/autogen_airwin
        compilerFlags:
          - "-Wno-multichar"
          - "-Wno-unused-but-set-variable"
          - "-Wno-unused-variable"
          - "-Wno-deprecated-declarations"
      - path: AirwindowsDSP/Documentation/awpdoc
        buildPhase: resources
      - path: AirwindowsDSP/Resources/effect_links.json
        buildPhase: resources
      - path: AirwindowsDSP/Resources/category_overrides.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terrordisco.airwindows.consolidated.dsp
        INFOPLIST_FILE: AirwindowsDSP/Info.plist
        DEFINES_MODULE: true
        MODULEMAP_FILE: AirwindowsDSP/module.modulemap
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_WARN_UNUSED_FUNCTION: false
        GCC_WARN_UNUSED_VALUE: false
        GCC_WARN_UNUSED_VARIABLE: false
        CLANG_WARN_DOCUMENTATION_COMMENTS: false
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        TARGETED_DEVICE_FAMILY: "2"
        OTHER_CPLUSPLUSFLAGS:
          - "-Wno-multichar"
          - "-Wno-unused-but-set-variable"
          - "-Wno-unused-variable"
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/AirwindowsDSP/Airwin
          - $(SRCROOT)/AirwindowsDSP/Airwin/autogen_airwin
          - $(SRCROOT)/AirwindowsDSP/Bridge
        GCC_UNITY_BUILD: true
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
